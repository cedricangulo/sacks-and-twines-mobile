<!-- Whole card navigates to the product detail page -->
<ion-card [routerLink]="['/product', product().id]">
  <ion-card-header>
    <!-- Interpolation of the product input signal -->
    <ion-card-title>{{ product().name }}</ion-card-title>
    <ion-card-subtitle
      >{{ product().skuCode }} · {{ product().baseUom }}</ion-card-subtitle
    >
  </ion-card-header>
  <ion-card-content>
    <p>Category: {{ product().category }}</p>
    <!-- Stops card navigation and bubbles the product up via (tap) -->
    <ion-button fill="clear" (click)="emitTap($event)"> Select </ion-button>
  </ion-card-content>
</ion-card>
