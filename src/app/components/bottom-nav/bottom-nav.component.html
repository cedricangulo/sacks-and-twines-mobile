<ion-tab-bar slot="bottom">
  <!-- Each tab is route-aware: selected only when active() matches -->
  <ion-tab-button
    [routerLink]="'/products'"
    [selected]="active() === 'products'"
  >
    <ion-icon name="basket"></ion-icon>
    <ion-label>Products</ion-label>
  </ion-tab-button>
  <ion-tab-button
    [routerLink]="'/dispatch'"
    [selected]="active() === 'dispatch'"
  >
    <ion-icon name="swap-horizontal"></ion-icon>
    <ion-label>Dispatch</ion-label>
  </ion-tab-button>
  <ion-tab-button
    [routerLink]="'/dispatch-history'"
    [selected]="active() === 'history'"
  >
    <ion-icon name="receipt"></ion-icon>
    <ion-label>History</ion-label>
  </ion-tab-button>
</ion-tab-bar>
