<ion-buttons>
  <!-- Decrement; disables at the min floor -->
  <ion-button
    fill="outline"
    size="small"
    (click)="dec()"
    [disabled]="value() <= min()"
    aria-label="Decrease quantity"
  >
    <ion-icon slot="icon-only" name="remove"></ion-icon>
  </ion-button>
  <!-- Current model value, two-way bound to the parent via [(value)] -->
  <ion-text class="stepper-value">{{ value() }}</ion-text>
  <!-- Increment by step -->
  <ion-button
    fill="outline"
    size="small"
    (click)="inc()"
    aria-label="Increase quantity"
  >
    <ion-icon slot="icon-only" name="add"></ion-icon>
  </ion-button>
</ion-buttons>
