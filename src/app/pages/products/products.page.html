<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Products</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Collapsing large title (scrolls away into the compact toolbar) -->
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Products</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Category filter -->
  <ion-segment
    [value]="category()"
    (ionChange)="onCategoryChange($event.detail.value)"
  >
    <ion-segment-button value="all">
      <ion-label>All</ion-label>
    </ion-segment-button>
    <ion-segment-button value="sacks">
      <ion-label>Sacks</ion-label>
    </ion-segment-button>
    <ion-segment-button value="twines">
      <ion-label>Twines</ion-label>
    </ion-segment-button>
  </ion-segment>

  <!-- Live search -->
  <ion-searchbar
    [ngModel]="query()"
    (ngModelChange)="query.set($event)"
    [debounce]="200"
    placeholder="Search products"
  ></ion-searchbar>

  <!-- Catalog cards -->
  @for (product of filteredProducts(); track product.id) {
  <app-product-card [product]="product"></app-product-card>
  } @empty {
  <!-- Empty state with a recovery action -->
  <div class="empty-state ion-padding">
    <ion-icon name="search-outline"></ion-icon>
    <h2>No products found</h2>
    <p>Try a different search or category.</p>
    <ion-button fill="clear" (click)="clearFilters()">Clear filters</ion-button>
  </div>
  }
</ion-content>
